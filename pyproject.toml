[project]
name = "driftpilot"
version = "0.1.0"
description = "Drift Protocol SOL perp trading bot with regime-switching strategy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.scripts]
driftpilot = "driftpilot.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
