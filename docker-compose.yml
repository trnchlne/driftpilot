services:
  bot:
    container_name: driftpilot
    image: ghcr.io/trnchlne/driftpilot:latest
    build: ./bot
    command: ["npx", "tsx", "src/live.ts", "--only", "R-base-SOL,R-fast-SOL,R-fast-HYPE"]
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - trenchln
    restart: unless-stopped

networks:
  trenchln:
    external: true
    name: trenchln_default
