services:
  driftpilot:
    build: .
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    # Override CMD with your desired flags, e.g.:
    #   docker compose run driftpilot --days 1 --no-charts
    #   docker compose run driftpilot --live
    # Default: fetch 7 days + generate charts
    command: ["--db", "/app/data/driftpilot.db", "--output-dir", "/app/output"]

  bot:
    build: ./bot
    environment:
      - PRIVATE_KEY=${PRIVATE_KEY}
      - RPC_URL=${RPC_URL}
      - DRY_RUN=${DRY_RUN:-true}
    restart: unless-stopped

  live:
    build: ./bot
    command: ["npx", "tsx", "src/live.ts"]
    environment:
      - PRIVATE_KEY=${PRIVATE_KEY}
      - RPC_URL=${RPC_URL}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
